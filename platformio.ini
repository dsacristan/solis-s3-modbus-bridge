; Puente Modbus local para el stick Solis S3-WIFI-ST (RTL8710BN / LibreTiny)
; Objetivo: servidor Modbus TCP que habla con el inversor Solis S5-EH1P4.6K-L por RS485.
; Instalación doméstica de referencia — proyecto evcc / carga solar.
;
; Ver README.md y docs/ para el diseño, los hallazgos y el protocolo.
;
; TRES ENTORNOS:
;   pio run        -> compila los tres (por defecto). El firmware "bueno" es solis-s3.
;   pio run -e solis-s3  -> firmware del puente: WiFi STA + web :80 + config AP +
;                           Modbus TCP :502 (MBAP) + Modbus RTU :5020 (FASE 1.5+2+3)
;   pio run -e diag      -> DIAGNOSTICO: barrido de GPIO para localizar los LEDs
;   pio run -e diag-btn  -> DIAGNOSTICO: boton PA08 + watchdog + LEDs
;
; Tests SIN hardware (host, g++):
;   g++ -std=c++17 -O2 -Wall -Wextra -Isrc tools/host_test_modbus.cpp -o /tmp/t && /tmp/t
;   python3 tools/verify_uf2.py .pio/build/solis-s3/firmware.bin

[env:solis-s3]
; ⚠️ LibeTiny 1.10.0 (igual que el build ESPHome que SÍ lee el inversor).
; Con 1.13.0 el RX del UART no recibe nada (probable incompatibilidad con el
; pin de ArduinoCore-API#RingBufferFix). Ver skill.
platform = libretiny@1.10.0
board = generic-rtl8710bx-4mb-980k        ; OJO: este stick lleva 8 MB, NO el "2mb-788k" del datasheet
framework = arduino
board_build.mcu = rtl8710bn
board_build.f_cpu = 125000000L
build_src_filter = +<main.cpp>

; --- Endurecimiento del stack TCP (incidente 08/10/2026: "evcc ciego ~1h45m") ---
; 1) Keepalive agresivo: el override del framework (10 s) queda compilado FUERA en builds
;    solo-WiFi, asi que rige el default de lwIP: TCP_KEEPIDLE_DEFAULT = 2 h. Con esto un
;    par muerto se detecta en ~30 s (15 s idle + 3 sondas x 5 s).
; 2) Pool de sockets: MEMP_NUM_NETCONN = 8 por defecto -> 16. Con 3 escuchas + 2 clientes
;    + reconexiones encoladas el pool se agotaba y lwIP abortaba con RST (incluso HTTP).
build_flags =
    -DTCP_KEEPIDLE_DEFAULT=15000
    -DTCP_KEEPINTVL_DEFAULT=5000
    -DTCP_KEEPCNT_DEFAULT=3
    -DMEMP_NUM_NETCONN=16

; El core de Arduino parcheado es OBLIGATORIO (libretiny#154 sigue abierto: el RingBuffer
; de Arduino no sirve para serie). Aplica también a sketches Arduino, no solo a ESPHome.
platform_packages =
    framework-arduino-api @ https://github.com/hn/ArduinoCore-API#RingBufferFix

monitor_speed = 9600                     ; el enlace al inversor va a 9600 8N1
upload_speed = 115200                    ; velocidad del ROM/xmodem al flashear

; --- Firmware de diagnostico (barrido de pines para localizar los LEDs) ---
[env:diag]
extends = env:solis-s3
build_src_filter = +<diag.cpp>

; --- Firmware de diagnostico (identificar el boton de reset: PA08 + vigilantes) ---
[env:diag-btn]
extends = env:solis-s3
build_src_filter = +<diag_btn.cpp>
